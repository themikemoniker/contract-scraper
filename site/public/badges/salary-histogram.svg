    <text x="40" y="34" text-anchor="end" font-size="10" fill="#6b7280">117</text>
    <line x1="50" y1="30" x2="370" y2="30" stroke="#f3f4f6" stroke-width="1"/>

  <!-- Bars -->
  
    <rect x="55" y="30" width="54" height="130" fill="#93c5fd" rx="4"/>
