<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220">
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
  </style>
  <rect width="400" height="220" fill="#ffffff" rx="8"/>

