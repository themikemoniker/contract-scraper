    <line x1="45" y1="56" x2="50" y2="56" stroke="#d1d5db" stroke-width="1"/>
    <text x="40" y="60" text-anchor="end" font-size="10" fill="#6b7280">94</text>
    <line x1="50" y1="56" x2="370" y2="56" stroke="#f3f4f6" stroke-width="1"/>
