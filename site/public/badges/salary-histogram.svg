    <rect x="119" y="148.88888888888889" width="54" height="11.11111111111111" fill="#60a5fa" rx="4"/>
    <text x="146" y="143.88888888888889" text-anchor="middle" font-size="11" fill="#374151" font-weight="500">10</text>
    <text x="146" y="195" text-anchor="middle" font-size="10" fill="#6b7280">$50-100k</text>
    <rect x="183" y="140" width="54" height="20" fill="#3b82f6" rx="4"/>
    <text x="210" y="135" text-anchor="middle" font-size="11" fill="#374151" font-weight="500">18</text>
